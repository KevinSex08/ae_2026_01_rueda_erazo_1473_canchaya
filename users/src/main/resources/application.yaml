spring:
  application:
    name: users
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Kevinsex250806@}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:http://localhost}

cognito:
  user-pool-id: ${COGNITO_USER_POOL_ID:us-east-1_xxxxx}
  client-id: ${COGNITO_APP_CLIENT_ID:xxxxx}
  region: ${AWS_REGION:us-east-1}

cors:
  allowed-origins:
    - "http://localhost:8100"
    - "capacitor://localhost"
    - "http://localhost"
    - "http://localhost:3000"

server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} | %-5level | ${spring.application.name} | sub=%X{sub:-anonimo} | %logger{40} | %msg%n"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: TRACE
