name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew (CanchaYa)
        run: chmod +x canchaya/gradlew

      - name: Build and Test CanchaYa Microservice
        working-directory: ./canchaya
        run: ./gradlew build

      - name: Grant execute permission for gradlew (Users)
        run: chmod +x users/gradlew

      - name: Build and Test Users Microservice
        working-directory: ./users
        run: ./gradlew build
