worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream canchaYa_backend {
        server canchaya:8080;
    }

    upstream users_backend {
        server users:8081;
    }

    server {
        listen 80;

        # Enrutar peticiones del microservicio de Canchas (canchaYa)
        location /api/v1/ {
            proxy_pass http://canchaYa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Enrutar peticiones del microservicio de Usuarios
        location /users/ {
            proxy_pass http://users_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
